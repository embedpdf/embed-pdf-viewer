<embedpdf-viewer id="viewer" src="https://www.embedpdf.com/pdfs/welcome.pdf" style="height: 100vh">
  <div slot="item:reviewers" class="reviewers">
    <img src="/avatars/ada.png" alt="Ada" title="Ada" />
    <img src="/avatars/grace.png" alt="Grace" title="Grace" />
  </div>
</embedpdf-viewer>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@embedpdf/viewer@3/dist/embedpdf.js';

  document.getElementById('viewer').config = {
    layout: (layout) => layout.add({ custom: 'reviewers' }, { to: 'main', section: 'end' }),
  };
</script>

<style>
  .reviewers {
    display: flex;
    gap: 4px;
  }
  /* The viewer sets data-orientation and data-edge on your element. */
  .reviewers[data-orientation='vertical'] {
    flex-direction: column;
  }
</style>
