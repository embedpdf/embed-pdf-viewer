            'packages/engine/runtime/build/generate-runtime-methods.mjs',
            'packages/engine/runtime/build/generate-napi-binding.mjs',
            'packages/engine/runtime/build/CMakeLists.txt',
            'packages/engine/runtime/build/compile.sh',
