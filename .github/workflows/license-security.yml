name: License security

on:
  pull_request:
    paths:
      - 'cloudpdf/server/src/app/buildApp.ts'
      - 'cloudpdf/server/src/app/secret-policy.ts'
      - 'cloudpdf/server/src/index.ts'
      - 'cloudpdf/server/src/licensing/**'
      - 'cloudpdf/server/src/bin/cloudpdf-server.ts'
      - 'cloudpdf/server/test/licensing.test.ts'
      - 'cloudpdf/server/test/secret-policy.test.ts'
      - 'cloudpdf/server/package.json'
      - '.github/workflows/license-security.yml'
  push:
    branches: [main]
    paths:
      - 'cloudpdf/server/src/app/buildApp.ts'
      - 'cloudpdf/server/src/app/secret-policy.ts'
      - 'cloudpdf/server/src/index.ts'
      - 'cloudpdf/server/src/licensing/**'
      - 'cloudpdf/server/src/bin/cloudpdf-server.ts'
      - 'cloudpdf/server/test/licensing.test.ts'
      - 'cloudpdf/server/test/secret-policy.test.ts'
      - 'cloudpdf/server/package.json'
      - '.github/workflows/license-security.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: license-security-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: signed proofs and fail-closed gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build published server artifact
        # Build the server's production workspace dependencies in topological
        # order. --filter-prod excludes core-signature's test-only dependency
        # on the local engine, whose browser worker needs a staged WASM payload.
        # Build tools remain available from the full dependency install above.
        # The server's runtime wrapper build needs no native or WASM payloads.
        # Before the tests: buildApp reaches the engine, which imports the
        # runtime wrapper from its dist.
        run: pnpm --filter-prod "@cloudpdf/server..." build

      # The runtime wrapper imports the wasm32 payload package, which Vite
      # resolves when it loads the engine for the tests; hydrate it, and the
      # host's native addon, from the content-addressed shelf as the package
      # tests do. A PR that changes runtime sources races its own Build PDF
      # Runtime workflow, hence the wait.
      - name: Fetch engine runtime payloads
        run: pnpm --filter @embedpdf/engine-runtime fetch:payload wasm32 linux-x64
        env:
          EPDF_PAYLOAD_WAIT_MINUTES: '30'

      - name: Adversarial licensing tests
        run: pnpm --filter @cloudpdf/server exec vitest run test/licensing.test.ts

      - name: Verify published license API boundary
        run: >-
          node --input-type=module -e "const m=await import('./cloudpdf/server/dist/index.js');
          const forbidden=['LicenseRuntime','buildAppForTesting','ConnectedUsageReporter'];
          const leaked=forbidden.filter((name)=>name in m);
          if(leaked.length) throw new Error('internal exports leaked: '+leaked.join(','));
          if(typeof m.createLicenseRuntime!=='function'||typeof m.buildApp!=='function')
          throw new Error('public license API missing');"
