# Canonical release workflow for `main`.
#
# GA promotion checklist (perform in the stable version PR):
#   1. Run `pnpm changeset pre exit` so Changesets prepares stable versions.
#   2. In package.json's `ci:publish`, remove `--tag next`; keep the
#      `node scripts/assert-publish-phase.mjs &&` prefix and
#      `--publish-branch main --report-summary`. The assert script reads
#      .changeset/pre.json and flips its own assertions at GA — it hard-fails
#      a forgotten `--tag`, a straggler version, or a package that dodged
#      versioning, in either phase.
#   3. Change the workflow/release labels, Changesets PR labels, and fallback
#      release notes below from "next" to stable; then set `prerelease: false`
#      and `make_latest: true`.
#   4. In merge-image, expand "Read server version" to also emit
#      `minor=${v%.*}`, then swap the `next` and `sha-*` tags in "Create
#      multi-arch manifest" for the minor tag and `latest`.
# Keep the consume gate for stable releases.
name: Release (next)

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'cloudpdf/**'
      - 'tooling/**'
      - '.changeset/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch: {}

concurrency:
  group: release-next
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  CI: true

jobs:
  build-runtime:
    uses: ./.github/workflows/build-engine-runtime.yml
    secrets: inherit

  release:
    needs: build-runtime
    runs-on: ubuntu-latest
    outputs:
      did_publish: ${{ steps.published.outputs.did_publish }}
      published: ${{ steps.published.outputs.published }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 10.34.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Download engine-runtime artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: engine-runtime-*
          path: packages/engine/runtime/_artifacts

      - name: Stage runtime payloads
        run: |
          shopt -s nullglob
          for dir in packages/engine/runtime/_artifacts/engine-runtime-*; do
            target="${dir##*/engine-runtime-}"
            mkdir -p "packages/engine/runtime/npm/$target"
            cp -R "$dir/." "packages/engine/runtime/npm/$target/"
          done
          rm -rf packages/engine/runtime/_artifacts

      - name: Verify engine-runtime packages
        run: pnpm run verify:engine-runtime-packages

      - name: Verify license security
        run: pnpm --filter @cloudpdf/server exec vitest run test/licensing.test.ts

      - name: Build packages
        run: pnpm run build:release

      # The consume gate: packs every publishable into real tarballs and runs
      # them through four consumer fixtures (node-esm, node-cjs, vite-app,
      # tsc-nodenext). A broken artifact can never reach a dist-tag.
      # (build:release above already built ./packages/**.)
      - name: Consume gate
        run: pnpm run verify:consume

      - name: Version / Publish via Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          # GA: remove the "(next)" suffixes; the publish command stays the same.
          commit: 'chore: version packages (next)'
          title: 'chore: version packages (next)'
          publish: pnpm ci:publish
          createGithubReleases: false

      - name: Detect publish summary
        id: published
        run: |
          if [ -f "pnpm-publish-summary.json" ]; then
            COUNT=$(jq '.publishedPackages | length' pnpm-publish-summary.json 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "did_publish=true" >> $GITHUB_OUTPUT
              echo "published=$(jq -c '.publishedPackages' pnpm-publish-summary.json)" >> $GITHUB_OUTPUT
              echo "version=$(jq -r '.publishedPackages[0].version' pnpm-publish-summary.json)" >> $GITHUB_OUTPUT
            else
              echo "did_publish=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "did_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Get merged PR info
        if: steps.published.outputs.did_publish == 'true'
        id: merged_pr
        uses: actions-ecosystem/action-get-merged-pull-request@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release notes
        if: steps.published.outputs.did_publish == 'true'
        env:
          PR_BODY: ${{ steps.merged_pr.outputs.body }}
        run: |
          echo "$PR_BODY" | sed -n '/# Releases/,$p' | tail -n +2 > release-notes.md || true

          if [ ! -s release-notes.md ]; then
            # GA: replace this fallback with "Automated release."
            echo "Pre-release from main." > release-notes.md
            echo "" >> release-notes.md
            echo "Packages published:" >> release-notes.md
            echo "${{ steps.published.outputs.published }}" >> release-notes.md
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Package published dists
        if: steps.published.outputs.did_publish == 'true'
        env:
          PUBLISHED_JSON: ${{ steps.published.outputs.published }}
        run: |
          mkdir -p release-assets
          # Where a package lives is asked of the workspace ONCE, never
          # reconstructed from its npm name: the tree is grouped
          # (packages/<group>/<member>, cloudpdf/viewer/<framework>), so NAMING.md's
          # name↔path rule cannot be inverted without hardcoding the group list.
          pnpm ls -r --depth -1 --json \
            | jq --arg root "$GITHUB_WORKSPACE/" \
                'map(select(.name and .path))
                 | map({ key: .name, value: (.path | ltrimstr($root)) })
                 | from_entries' > "$RUNNER_TEMP/workspace-dirs.json"
          echo "$PUBLISHED_JSON" | jq -r '.[].name' | while read -r name; do
            # Asset names keep the scope: @embedpdf/viewer-react and
            # @cloudpdf/viewer-react are different packages that can publish in
            # the same run, and a bare "viewer-react" would collide.
            slug="${name#@}"; slug="${slug//\//-}"
            dir="$(jq -r --arg name "$name" '.[$name] // ""' "$RUNNER_TEMP/workspace-dirs.json")"
            if [ -z "$dir" ]; then
              echo "::warning::no workspace directory for $name — skipping"
              continue
            fi
            if [ -d "$dir/dist" ]; then
              echo "Packaging $name from $dir"
              (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release-assets/${slug}-dist.zip" dist >/dev/null)
              tar -czf "release-assets/${slug}-dist.tar.gz" -C "$dir" dist
            else
              echo "No dist for $name"
            fi
          done
          ls -lh release-assets || true

      - name: Create GitHub pre-release
        if: steps.published.outputs.did_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.published.outputs.version }}
          # GA: rename to "Release v...", then flip the two flags below.
          name: 'Release Next v${{ steps.published.outputs.version }}'
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: true
          make_latest: false

  # Preview container image for the `next` channel, multi-arch. Each arch is
  # built NATIVELY on its own runner (amd64 on ubuntu-latest, arm64 on
  # ubuntu-24.04-arm — the same runner family build-engine-runtime already
  # uses). QEMU is avoided on purpose: the in-image monorepo build is far too
  # heavy to emulate, and turbo's Rust binary is already known to break under
  # it (see cloudpdf/server/Dockerfile). Each build pushes by digest only;
  # merge-image below assembles the manifest and owns every tag.
  publish-image:
    needs: [build-runtime, release]
    if: needs.release.outputs.did_publish == 'true' && contains(needs.release.outputs.published, '@cloudpdf/server')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            target: linux-x64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ${{ matrix.target }} native runtime
        uses: actions/download-artifact@v7
        with:
          name: engine-runtime-${{ matrix.target }}
          path: packages/engine/runtime/npm/${{ matrix.target }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — tags are applied by merge-image. The OCI source label
      # is what auto-links the GHCR package to this repository.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/embedpdf/cloudpdf-server

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloudpdf/server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NATIVE_SRC=prebuilt
          labels: ${{ steps.meta.outputs.labels }}
          # Plain per-arch image manifests: the merged index then contains
          # exactly the two platform entries (no unknown/unknown attestation
          # rows in the GHCR UI).
          provenance: false
          outputs: type=image,name=ghcr.io/embedpdf/cloudpdf-server,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: image-digest-${{ matrix.target }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest and apply the
  # channel tags (the prerelease version, `next`, and `sha-<short>`) so
  # candidates can be pulled + smoke/soak tested before promotion. Never
  # moves `latest`.
  merge-image:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read server version
        id: ver
        # GA: expand this step as described in the promotion checklist to emit
        # the stable minor tag as well as the full version.
        run: echo "version=$(jq -r .version cloudpdf/server/package.json)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        # GA: swap the `next` and `sha-*` tags for `:${minor}` and `:latest`
        # per the promotion checklist.
        run: |
          short_sha="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          docker buildx imagetools create \
            -t 'ghcr.io/embedpdf/cloudpdf-server:${{ steps.ver.outputs.version }}' \
            -t 'ghcr.io/embedpdf/cloudpdf-server:next' \
            -t "ghcr.io/embedpdf/cloudpdf-server:sha-${short_sha}" \
            $(printf 'ghcr.io/embedpdf/cloudpdf-server@sha256:%s ' *)

      - name: Verify manifest
        run: docker buildx imagetools inspect 'ghcr.io/embedpdf/cloudpdf-server:${{ steps.ver.outputs.version }}'
