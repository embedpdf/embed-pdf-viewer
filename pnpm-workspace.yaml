packages:
  - 'packages/**'
  - 'examples/**'
  # Recursive, like packages/: the ee tree groups a product line into a
  # directory once it has siblings (ee/viewer/{main,react,vue,...}).
  - 'ee/**'
  - 'tooling/*'
  - 'website'
  # exclude generated outputs that can contain nested package.json copies
  # (ng-packagr always emits one into dist) and confuse workspace discovery.
  - '!**/dist/**'
  - '!**/.next/**'
  - '!**/.svelte-kit/**'
  - '!**/.vercel/**'
  # exclude the git submodule (and everything inside it)
  - '!packages/engine/runtime/runtime-src/**'
