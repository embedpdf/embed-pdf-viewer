<embedpdf-viewer id="viewer" src="/report.pdf" style="height: 100vh">
  <div slot="item:zoom-pill" class="zoom-pill">
    <epdf-button command="zoom:out"></epdf-button>
    <span id="zoom-level">100%</span>
    <epdf-button command="zoom:in"></epdf-button>
  </div>
</embedpdf-viewer>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@embedpdf/viewer@3/dist/embedpdf.js';

  const element = document.getElementById('viewer');
  element.addEventListener('epdf:ready', () => {
    const { viewer } = element;
    viewer.watch(
      () => viewer.get('stage').getZoomLevel(),
      (level) => (document.getElementById('zoom-level').textContent = `${Math.round(level * 100)}%`),
    );
  });
</script>
