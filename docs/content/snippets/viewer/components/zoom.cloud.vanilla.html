<embedpdf-viewer id="viewer" style="height: 100vh">
  <div slot="item:zoom-pill" class="zoom-pill">
    <epdf-button command="zoom:out"></epdf-button>
    <span id="zoom-level">100%</span>
    <epdf-button command="zoom:in"></epdf-button>
  </div>
</embedpdf-viewer>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@cloudpdf/viewer@3/dist/cloudpdf.js';

  const element = document.getElementById('viewer');
  element.config = {
    layout: (layout) => layout.add({ custom: 'zoom-pill' }, { to: 'main', section: 'end' }),
  };
  element.addEventListener('epdf:ready', () => {
    const { viewer } = element;
    viewer.watch(
      () => viewer.get('stage').getZoomLevel(),
      (level) =>
        (document.getElementById('zoom-level').textContent = `${Math.round(level * 100)}%`),
      { immediate: true },
    );
  });
  element.src = '/pdfs/welcome.pdf';
</script>

<style>
  .zoom-pill {
    display: flex;
    align-items: center;
    gap: 4px;
  }
</style>
