<button id="print" disabled>Print</button>
<div id="viewer" style="height: 80vh"></div>

<script type="module">
  import EmbedPDF from 'https://cdn.jsdelivr.net/npm/@embedpdf/viewer@3/dist/embedpdf.js';

  const print = document.getElementById('print');

  EmbedPDF.init({
    target: '#viewer',
    src: '/report.pdf',
    onReady: (viewer) => {
      print.disabled = false;
      print.onclick = () => viewer.commands.execute('document:print');
    },
  });
</script>
