<!-- A static page needs nothing: the element upgrades when the script loads. -->
<embedpdf-viewer id="viewer" style="height: 100vh"></embedpdf-viewer>
<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@cloudpdf/viewer@3/dist/cloudpdf.js';

  document.getElementById('viewer').src = '/pdfs/welcome.pdf';
</script>
