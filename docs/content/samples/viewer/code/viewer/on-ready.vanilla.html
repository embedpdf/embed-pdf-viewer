<link rel="stylesheet" href="./on-ready.css" />

<div class="app">
  <header class="bar">
    <span class="page" id="page">Opening…</span>
    <button type="button" class="button" id="print" disabled>Print</button>
  </header>
  <embedpdf-viewer id="viewer" class="viewer"></embedpdf-viewer>
</div>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@embedpdf/viewer@3/dist/embedpdf.js';

  // [!doc-source article]
  const article = 'https://www.embedpdf.com/pdfs/article.pdf';
  // [!/doc-source]

  const element = document.getElementById('viewer');
  const page = document.getElementById('page');
  const print = document.getElementById('print');

  element.addEventListener('epdf:ready', () => {
    const { viewer } = element;
    print.disabled = false;
    print.onclick = () => viewer.commands.execute('document:print');
    // The pages are the document's: `watch` waits for it to open, then follows the current page.
    viewer.watch(
      () => viewer.get('stage').getCurrentPageIndex(),
      (index) => (page.textContent = `Page ${index + 1}`),
      { immediate: true },
    );
  });
  element.config = { src: article };
</script>
