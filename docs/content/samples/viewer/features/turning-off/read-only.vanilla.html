<embedpdf-viewer id="viewer" style="height: 100%"></embedpdf-viewer>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@embedpdf/viewer@3/dist/embedpdf.js';

  // [!doc-source report]
  const report = 'https://www.embedpdf.com/pdfs/report.pdf';
  // [!/doc-source]

  document.getElementById('viewer').config = {
    src: report,
    readOnly: true,
    features: { 'documents.download': false, 'documents.print': false },
  };
</script>
