<select id="contracts">
  <option value="contract-42">Contract 42</option>
  <option value="contract-43">Contract 43</option>
</select>
<embedpdf-viewer id="viewer" style="height: 80vh"></embedpdf-viewer>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@cloudpdf/viewer@3/dist/cloudpdf.js';
  import { fetchDocumentToken } from './api.js'; // your backend: a token for this user and document

  const viewer = document.getElementById('viewer');
  const contracts = document.getElementById('contracts');
  const open = (id) => (viewer.src = { token: () => fetchDocumentToken(id) });
  contracts.addEventListener('change', () => open(contracts.value));
  open(contracts.value);
</script>
