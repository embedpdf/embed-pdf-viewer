<embedpdf-viewer id="viewer" style="height: 100vh">
  <section slot="panel:notes" class="notes">
    <textarea placeholder="Your notes"></textarea>
  </section>
</embedpdf-viewer>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@cloudpdf/viewer@3/dist/cloudpdf.js';

  document.getElementById('viewer').config = {
    src: { grant: 'shr_gvpJcG1ULUMon19C0D1wODSY' },
    layout: (layout) =>
      layout
        .addPanel('notes', { side: 'end', title: 'Notes', icon: 'book' })
        .add('panel:notes', { to: 'main', section: 'end' }),
  };
</script>
