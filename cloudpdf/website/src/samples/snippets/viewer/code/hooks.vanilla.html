<embedpdf-viewer id="viewer" style="height: 100vh">
  <form slot="header" id="search-form">
    <input type="search" placeholder="Search" id="query" />
    <span id="count"></span>
  </form>
</embedpdf-viewer>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@cloudpdf/viewer@3/dist/cloudpdf.js';

  const element = document.getElementById('viewer');
  element.addEventListener('epdf:ready', () => {
    const { viewer } = element;
    document.getElementById('query').oninput = (event) =>
      viewer.get('search').search({ text: event.target.value });
    viewer.watch(
      () => viewer.get('search').getHitCount(),
      (count) => (document.getElementById('count').textContent = count ? `${count} matches` : ''),
    );
  });
  element.src = { grant: 'shr_gvpJcG1ULUMon19C0D1wODSY' };
</script>
