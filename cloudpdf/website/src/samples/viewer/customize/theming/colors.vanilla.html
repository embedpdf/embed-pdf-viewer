<link rel="stylesheet" href="./colors.css" />

<div class="app" id="app">
  <header class="bar">
    <label>
      <input type="checkbox" id="dark" />
      Dark
    </label>
  </header>
  <embedpdf-viewer id="viewer" class="viewer"></embedpdf-viewer>
</div>

<script type="module">
  import 'https://cdn.jsdelivr.net/npm/@cloudpdf/viewer@3/dist/cloudpdf.js';

  const welcome = { grant: 'shr_gvpJcG1ULUMon19C0D1wODSY' };

  // Your colors for both modes, and what's different in dark.
  const brand = {
    accent: '#0f6e56',
    tokens: { surface: '#fbfaf7', canvas: '#ece8df', radius: '2px' },
    dark: {
      accent: '#4fbf98',
      surface: '#16201c',
      'surface-raised': '#1d2a25',
      canvas: '#0c1210',
      hover: '#24332d',
    },
  };

  const app = document.getElementById('app');
  const viewer = document.getElementById('viewer');
  const dark = document.getElementById('dark');

  // Your app and the viewer, light or dark as the switch says.
  const show = () => {
    app.classList.toggle('dark', dark.checked);
    viewer.theme = { ...brand, preference: dark.checked ? 'dark' : 'light' };
  };

  viewer.config = { src: welcome };
  show();
  dark.addEventListener('change', show);
</script>
