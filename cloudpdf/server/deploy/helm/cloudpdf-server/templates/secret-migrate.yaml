{{- if and .Values.migrations.enabled (not .Values.existingSecret) .Values.secrets }}
# Hook-scoped copy of the inline secrets for the migrate Job — same
# ordering rationale as configmap-migrate.yaml. Not rendered when
# `existingSecret` is set (that Secret predates the release and the Job
# references it directly).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudpdf-server.fullname" . }}-migrate
  labels:
    {{- include "cloudpdf-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
