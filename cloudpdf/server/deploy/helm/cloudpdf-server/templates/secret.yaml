{{- if and (not .Values.existingSecret) .Values.secrets }}
# Inline-values secrets — dev/eval convenience. Production should use an
# externally-managed Secret via `existingSecret` (see values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudpdf-server.fullname" . }}
  labels:
    {{- include "cloudpdf-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
