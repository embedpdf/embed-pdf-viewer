name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: go.sum
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test -run '^$' ./...
