<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@embedpdf/viewer — dev harness</title>
    <style>
      body {
        margin: 0;
        font: 13px system-ui, sans-serif;
      }
      /* EXTERNAL controls — plain page HTML driving el.viewer (the DRIVE door). */
      #drive {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: #111827;
        color: #e5e7eb;
      }
      #drive button {
        font: inherit;
      }
      #viewer {
        height: calc(100vh - 36px);
      }
      /* RESTYLE door: page CSS reshaping shadow internals via ::part. */
      embedpdf-viewer::part(toolbar-button) {
        border-radius: 2px;
      }
      embedpdf-viewer::part(tab) {
        border-radius: 0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 11px;
      }
      embedpdf-viewer::part(mode-tab-active) {
        text-decoration: underline;
        text-underline-offset: 6px;
      }
    </style>
  </head>
  <body>
    <div id="drive">
      <strong>page-side controls:</strong>
      <button id="zoom-in">Zoom in</button>
      <button id="zoom-out">Zoom out</button>
      <span id="doc-label">no document</span>
      <span id="selection-label"></span>
    </div>
    <div id="viewer"></div>
    <script type="module" src="/src/dev.ts"></script>
  </body>
</html>
